<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login - Admin DevChat</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d44f7'/%3E%3Cpath d='M17 5 8 18h6l-1 9 9-13h-6z' fill='white'/%3E%3C/svg%3E" />
<style>
:root {
  --purple-600: #6d44f7;
  --purple-700: #5a30e0;
  --slate-900: #1a2238;
  --slate-700: #3a455f;
  --slate-500: #6b7690;
  --slate-200: #e4e8f1;
  --bg: #ffffff;
  --bg-soft: #f7f8fc;
  --radius: 18px;
  --shadow-md: 0 8px 30px rgba(11,16,32,.08);
}

* { box-sizing: border-box; margin: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: var(--slate-900);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-container {
  background: white;
  border-radius: var(--radius);
  padding: 48px;
  max-width: 420px;
  width: 100%;
  box-shadow: var(--shadow-md);
}

.logo {
  text-align: center;
  margin-bottom: 32px;
}

.logo svg {
  width: 64px;
  height: 64px;
}

h1 {
  font-size: 28px;
  font-weight: 800;
  color: var(--slate-900);
  margin-bottom: 8px;
  text-align: center;
}

.subtitle {
  color: var(--slate-500);
  font-size: 15px;
  text-align: center;
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: 600;
  color: var(--slate-700);
  margin-bottom: 8px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px 18px;
  border: 1.5px solid var(--slate-200);
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
  outline: none;
  border-color: var(--purple-600);
  box-shadow: 0 0 0 3px rgba(109, 68, 247, 0.1);
}

.btn {
  width: 100%;
  padding: 16px;
  background: var(--purple-600);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  margin-top: 8px;
}

.btn:hover {
  background: var(--purple-700);
}

.btn:active {
  transform: scale(0.98);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.error-message {
  background: #fee;
  color: #c33;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 20px;
  display: none;
}

.error-message.show {
  display: block;
}

.footer-note {
  text-align: center;
  margin-top: 24px;
  color: var(--slate-500);
  font-size: 13px;
}

@media (max-width: 480px) {
  .login-container {
    padding: 32px 24px;
  }
}
</style>
</head>
<body>
<div class="login-container">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="8" fill="#6d44f7"/>
      <path d="M17 5 8 18h6l-1 9 9-13h-6z" fill="white"/>
    </svg>
  </div>
  
  <h1>Admin DevChat</h1>
  <p class="subtitle">Faça login para acessar o painel</p>
  
  <div class="error-message" id="errorMessage"></div>
  
  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email" />
    </div>
    
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
    </div>
    
    <button type="submit" class="btn" id="loginBtn">Entrar</button>
  </form>
  
  <p class="footer-note">DevChat © 2026 DevZapp</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script>
(function() {
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMessage');
  
  function showError(message) {
    errorMsg.textContent = message;
    errorMsg.classList.add('show');
  }
  
  function hideError() {
    errorMsg.classList.remove('show');
  }
  
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideError();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
      showError('Por favor, preencha todos os campos.');
      return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    
    try {
      if (!supabase) {
        throw new Error('Supabase não está configurado');
      }
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if (error) {
        throw error;
      }
      
      // Login bem-sucedido
      console.log('Login bem-sucedido:', data);
      window.location.href = '/admin/';
      
    } catch (error) {
      console.error('Erro no login:', error);
      showError(error.message || 'Erro ao fazer login. Verifique suas credenciais.');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
